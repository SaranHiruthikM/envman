services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: envman
      POSTGRES_PASSWORD: envman123
      POSTGRES_DB: envman
    ports:
      - "5432:5432"
    volumes:
      - envman_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envman"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DB_URL: postgres://envman:envman123@db:5432/envman?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: ["up"]

  server:
    build:
      context: .
      target: server
    environment:
      DB_URL: postgres://envman:envman123@db:5432/envman?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be at least 32 characters}
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  envman_data:
